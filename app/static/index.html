<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" id="theme-color" content="#f4f6f8">
<script>
  // 状态栏颜色：用一个不带 media 的 theme-color，按系统深浅色切换（部分安卓 Chrome 不认 media 写法）
  (function () {
    var m = window.matchMedia && matchMedia('(prefers-color-scheme: dark)');
    var set = function () { document.getElementById('theme-color').content = m && m.matches ? '#10161c' : '#f4f6f8'; };
    set(); if (m && m.addEventListener) m.addEventListener('change', set);
  })();
</script>
<meta name="color-scheme" content="light dark">
<title>知识库</title>
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="icon" href="/static/icon-192.png">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="stylesheet" href="/static/style.css?v=8">
</head>
<body>
<header class="appbar" id="appbar"></header>
<main id="view"></main>
<button class="fab" id="fab" aria-label="新建" hidden></button>
<div id="toast" role="status" hidden></div>
<div id="overlay" hidden></div>
<script src="/static/app.js?v=8"></script>
</body>
</html>
